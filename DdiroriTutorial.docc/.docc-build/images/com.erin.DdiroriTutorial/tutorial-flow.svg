<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Ddirori 튜토리얼 상태 흐름</title>
  <desc id="description">시범, 연습, 추적 중단, 사이클 성공과 완료 상태의 관계</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1423"/>
      <stop offset="1" stop-color="#263e62"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b7c9df"/>
    </marker>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.22"/></filter>
  </defs>
  <rect width="1600" height="900" rx="42" fill="url(#bg)"/>
  <circle cx="260" cy="210" r="260" fill="#786ce8" fill-opacity="0.08"/>
  <circle cx="480" cy="790" r="360" fill="#55d6be" fill-opacity="0.05"/>

  <g stroke="#b7c9df" stroke-width="7" fill="none" marker-end="url(#arrow)">
    <path d="M1010 230 H1100"/>
    <path d="M1310 230 H1400"/>
    <path d="M1505 335 V445"/>
    <path d="M1400 550 H1310"/>
    <path d="M1205 655 V735"/>
    <path d="M1100 550 H1010"/>
    <path d="M905 445 V335"/>
  </g>

  <g filter="url(#shadow)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">
    <rect x="800" y="125" width="210" height="210" rx="42" fill="#fff3c3"/>
    <text x="905" y="215" fill="#594600" font-size="31" font-weight="700">가이드 시범</text>
    <text x="905" y="260" fill="#806a20" font-size="22">경로 미리보기</text>

    <rect x="1100" y="125" width="210" height="210" rx="42" fill="#dff8f1"/>
    <text x="1205" y="215" fill="#174f47" font-size="31" font-weight="700">연습</text>
    <text x="1205" y="260" fill="#39766d" font-size="22">1 → 2 → 3 → 4</text>

    <rect x="1400" y="125" width="210" height="210" rx="42" fill="#dceeff"/>
    <text x="1505" y="215" fill="#184a78" font-size="31" font-weight="700">사이클 성공</text>
    <text x="1505" y="260" fill="#47769f" font-size="22">연속 횟수 +1</text>

    <rect x="1400" y="445" width="210" height="210" rx="42" fill="#6d61dc"/>
    <text x="1505" y="535" fill="#ffffff" font-size="31" font-weight="700">3회 성공</text>
    <text x="1505" y="580" fill="#e3dfff" font-size="22">완료</text>

    <rect x="1100" y="445" width="210" height="210" rx="42" fill="#ffffff"/>
    <text x="1205" y="535" fill="#233c5b" font-size="31" font-weight="700">다음 사이클</text>
    <text x="1205" y="580" fill="#60758f" font-size="22">Beat 1로</text>

    <rect x="800" y="445" width="210" height="210" rx="42" fill="#ffe4df"/>
    <text x="905" y="535" fill="#7b332d" font-size="31" font-weight="700">추적 중단</text>
    <text x="905" y="580" fill="#9d5c56" font-size="22">판정 멈춤</text>

    <rect x="1100" y="735" width="210" height="120" rx="34" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="1205" y="808" fill="#ffffff" font-size="25" font-weight="600">손 추적 복구</text>
  </g>
</svg>
